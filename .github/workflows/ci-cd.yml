name: Production CI/CD Delivery Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/todo-backend
  FRONTEND_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/todo-frontend

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Backend CI (Build & Unit Test)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests
        working-directory: ./Backend/todo-summary-assistant
        run: mvn clean test -B

      - name: Package Spring Boot Application
        working-directory: ./Backend/todo-summary-assistant
        run: mvn package -DskipTests -B

  # ---------------------------------------------------------------------------
  # Stage 2: Frontend CI (Build & Test)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./Frontend/todo/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend/todo
        run: npm ci

      - name: Execute Frontend Tests
        working-directory: ./Frontend/todo
        run: npm test -- --watchAll=false

      - name: Build React Application
        working-directory: ./Frontend/todo
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage 3: Docker Build & Push to Registry
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend/todo-summary-assistant
          file: ./Backend/todo-summary-assistant/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/todo
          file: ./Frontend/todo/Dockerfile
          build-args: |
            REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Stage 4: Automated Deployment & Healthcheck Verification on EC2
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2 & Health Check
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deployment and Container Orchestration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "==== Starting Automated Container Deployment ===="
            
            # Export environment variables for Docker Compose
            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            export SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            export SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            export COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
            export SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}

            # Navigate to deployment directory
            cd /opt/todo-app || exit 1

            # Pull latest tagged containers
            docker compose pull backend frontend

            # Re-create containers with zero downtime / fast restart
            docker compose up -d backend frontend

            # Wait for backend initialization and perform automated health check
            echo "==== Executing Post-Deployment Health Check ===="
            HEALTH_CHECK_STATUS=0
            for i in {1..12}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "Health check succeeded with HTTP 200 OK!"
                HEALTH_CHECK_STATUS=1
                break
              fi
              echo "Waiting for container health check... (attempt $i/12, status: $HTTP_CODE)"
              sleep 5
            done

            if [ $HEALTH_CHECK_STATUS -ne 1 ]; then
              echo "CRITICAL: Post-deployment health check failed! Initiating rollback..."
              docker compose rollback || docker compose up -d --build
              exit 1
            fi

            echo "==== Deployment Completed Successfully ===="
